<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Freelancer Web Place{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
  {% block extra_head %}{% endblock %}
</head>
<body>

<nav class="fwp-navbar">
  <div class="container d-flex align-items-center justify-content-between">
    <a href="/" class="brand">Freelancer Web Place<span class="dot">.</span></a>
    <div class="d-flex align-items-center gap-2" id="navAuthArea">
      <a href="/login" class="nav-link">Log in</a>
      <a href="/register/client" class="nav-link">Hire talent</a>
      <a href="/register/freelancer" class="btn btn-gold btn-sm px-3">Become a freelancer</a>
    </div>
  </div>
</nav>

{% block content %}{% endblock %}

<footer class="footer-fwp">
  <div class="container d-flex justify-content-between flex-wrap gap-2">
    <span>&copy; 2026 Freelancer Web Place — Final Year Major Project</span>
    <span class="mono">AI-matched hiring · Built with Flask + ML</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
