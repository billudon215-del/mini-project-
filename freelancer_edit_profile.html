{% extends "base.html" %}
{% block title %}Edit Profile — Freelancer Web Place{% endblock %}

{% block content %}
<section class="section-pad">
  <div class="container" style="max-width:600px">
    <div class="fwp-card p-4 p-md-5">
      <h3 class="mb-4">Edit your profile</h3>
      <form id="editForm">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" id="name">
          </div>
          <div class="col-md-6">
            <label class="form-label">Mobile number</label>
            <input type="text" class="form-control" id="mobile_number">
          </div>
          <div class="col-12">
            <label class="form-label">Bio</label>
            <textarea class="form-control" id="bio" rows="3"></textarea>
          </div>
          <div class="col-12">
            <label class="form-label">Skills (comma separated)</label>
            <input type="text" class="form-control" id="skills">
          </div>
          <div class="col-md-4">
            <label class="form-label">Experience (years)</label>
            <input type="number" step="0.5" class="form-control" id="experience_years">
          </div>
          <div class="col-md-4">
            <label class="form-label">Hourly rate ($)</label>
            <input type="number" class="form-control" id="hourly_rate">
          </div>
          <div class="col-md-4">
            <label class="form-label">Availability</label>
            <select class="form-select" id="availability">
              <option value="available">Available</option>
              <option value="busy">Busy</option>
              <option value="unavailable">Unavailable</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Location</label>
            <input type="text" class="form-control" id="location">
          </div>
          <div class="col-md-6">
            <label class="form-label">Portfolio URL</label>
            <input type="url" class="form-control" id="portfolio_url">
          </div>
          <div class="col-md-6">
            <label class="form-label">Update resume</label>
            <input type="file" class="form-control" id="resume" accept=".pdf,.doc,.docx">
          </div>
          <div class="col-md-6">
            <label class="form-label">Update profile picture</label>
            <input type="file" class="form-control" id="profile_picture" accept="image/*">
          </div>
        </div>
        <div id="editMsg" class="small mt-3"></div>
        <button type="submit" class="btn btn-fwp-primary w-100 mt-3">Save changes</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}

{% block extra_scripts %}
<script>
async function loadProfile() {
  const res = await FWP.api("/api/freelancer/dashboard");
  if (!res || !res.ok) { window.location.href = "/login"; return; }
  const p = res.data.profile;
  document.getElementById("name").value = p.name || "";
  document.getElementById("mobile_number").value = p.mobile_number || "";
  document.getElementById("bio").value = p.bio || "";
  document.getElementById("skills").value = p.skills_text || "";
  document.getElementById("experience_years").value = p.experience_years || "";
  document.getElementById("hourly_rate").value = p.hourly_rate || "";
  document.getElementById("availability").value = p.availability || "available";
  document.getElementById("location").value = p.location || "";
  document.getElementById("portfolio_url").value = p.portfolio_url || "";
}

document.getElementById("editForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const fd = new FormData();
  ["name","mobile_number","bio","skills","experience_years","hourly_rate","availability","location","portfolio_url"]
    .forEach(id => fd.append(id, document.getElementById(id).value));
  const resumeFile = document.getElementById("resume").files[0];
  const picFile = document.getElementById("profile_picture").files[0];
  if (resumeFile) fd.append("resume", resumeFile);
  if (picFile) fd.append("profile_picture", picFile);

  const res = await FWP.api("/api/freelancer/profile", { method: "PUT", body: fd, isForm: true });
  const msgEl = document.getElementById("editMsg");
  if (res && res.ok) { msgEl.className = "small mt-3 text-success"; msgEl.textContent = "Profile updated."; }
  else { msgEl.className = "small mt-3 text-danger"; msgEl.textContent = (res && res.data && res.data.message) || "Update failed."; }
});

document.addEventListener("DOMContentLoaded", loadProfile);
</script>
{% endblock %}
