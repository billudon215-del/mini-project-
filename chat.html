{% extends "base.html" %}
{% block title %}Chat — Freelancer Web Place{% endblock %}

{% block content %}
<section class="section-pad">
  <div class="container" style="max-width:720px">
    <h5 class="mb-3">Chat</h5>
    <div id="chatWindow" class="chat-window mb-2"></div>
    <div class="typing-indicator" id="typingIndicator"></div>
    <form id="chatForm" class="d-flex gap-2 mt-2">
      <input type="text" id="chatInput" class="form-control" placeholder="Type a message…" autocomplete="off">
      <button type="submit" class="btn btn-fwp-gold"><i class="bi bi-send"></i></button>
    </form>
  </div>
</section>
{% endblock %}

{% block extra_scripts %}
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="{{ url_for('static', filename='js/chat.js') }}"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  if (!FWP.isLoggedIn()) { window.location.href = "/login"; return; }
  const myRole = FWP.getRole();
  const myUser = FWP.getUser();
  initChat({{ chat_id }}, myRole, myUser.id);
});
</script>
{% endblock %}
