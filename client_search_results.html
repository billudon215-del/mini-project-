{% extends "base.html" %}
{% block title %}Search Freelancers — Freelancer Web Place{% endblock %}

{% block content %}
<section class="section-pad">
  <div class="container">
    <div class="row g-4">
      <div class="col-lg-3">
        <div class="fwp-card p-3">
          <h6 class="mb-3">Filters</h6>
          <label class="form-label small">Requirement</label>
          <textarea id="fQuery" class="form-control form-control-sm mb-3" rows="3"></textarea>
          <label class="form-label small">Category</label>
          <select id="fCategory" class="form-select form-select-sm mb-3">
            <option value="">Any</option>
            <option>Web Development</option>
            <option>Mobile App Development</option>
            <option>Graphic Design</option>
            <option>Content Writing</option>
            <option>Digital Marketing</option>
            <option>Data Science</option>
            <option>Video Editing</option>
            <option>UI/UX Design</option>
            <option>SEO</option>
            <option>Machine Learning</option>
          </select>
          <label class="form-label small">Skill contains</label>
          <input id="fSkill" class="form-control form-control-sm mb-3" placeholder="e.g. react">
          <label class="form-label small">Min rating</label>
          <input id="fMinRating" type="number" step="0.5" min="0" max="5" class="form-control form-control-sm mb-3">
          <label class="form-label small">Max $/hr</label>
          <input id="fMaxPrice" type="number" class="form-control form-control-sm mb-3">
          <label class="form-label small">Location contains</label>
          <input id="fLocation" class="form-control form-control-sm mb-3">
          <button class="btn btn-fwp-primary btn-sm w-100" onclick="loadResults()">Apply filters</button>
        </div>
      </div>

      <div class="col-lg-9">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="mb-0" id="resultsHeading">Results</h5>
          <span class="mono small text-muted-fwp" id="mlStatus"></span>
        </div>
        <div id="resultsList" class="row g-3"></div>
      </div>
    </div>
  </div>
</section>

<!-- Hire Modal -->
<div class="modal fade" id="hireModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content p-3">
      <div class="modal-header"><h5 class="modal-title">Send project request</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <input type="hidden" id="hireFreelancerId">
        <label class="form-label">Project title</label>
        <input class="form-control mb-3" id="hireTitle" required>
        <label class="form-label">Description</label>
        <textarea class="form-control mb-3" id="hireDescription" rows="3"></textarea>
        <div class="row g-2">
          <div class="col-6"><label class="form-label">Budget ($)</label><input type="number" class="form-control" id="hireBudget"></div>
          <div class="col-6"><label class="form-label">Timeline (days)</label><input type="number" class="form-control" id="hireTimeline" value="7"></div>
        </div>
      </div>
      <div class="modal-footer"><button class="btn btn-fwp-primary" onclick="sendHireRequest()">Send request</button></div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
let hireModal;

function paramsFromUrl() {
  return new URLSearchParams(window.location.search);
}

function prefillFromUrl() {
  const p = paramsFromUrl();
  document.getElementById("fQuery").value = p.get("q") || "";
  document.getElementById("fCategory").value = p.get("category") || "";
  document.getElementById("fMaxPrice").value = p.get("max_price") || "";
}

async function loadResults() {
  const params = new URLSearchParams();
  const q = document.getElementById("fQuery").value.trim();
  const category = document.getElementById("fCategory").value;
  const skill = document.getElementById("fSkill").value.trim();
  const minRating = document.getElementById("fMinRating").value;
  const maxPrice = document.getElementById("fMaxPrice").value;
  const location = document.getElementById("fLocation").value.trim();

  if (q) params.set("q", q);
  if (category) params.set("category", category);
  if (skill) params.set("skill", skill);
  if (minRating) params.set("min_rating", minRating);
  if (maxPrice) params.set("max_price", maxPrice);
  if (location) params.set("location", location);

  const res = await FWP.api(`/api/search/freelancers?${params.toString()}`);
  const list = document.getElementById("resultsList");
  list.innerHTML = "";
  if (!res || !res.ok) { FWP.toast("Search failed.", true); return; }

  document.getElementById("resultsHeading").textContent = `${res.data.count} match${res.data.count === 1 ? "" : "es"}`;
  document.getElementById("mlStatus").textContent = res.data.ml_model_active
    ? "ML model: active (TF-IDF + Random Forest)" : "ML model: fallback keyword mode";

  if (!res.data.results.length) {
    list.innerHTML = `<p class="text-muted-fwp">No freelancers match those filters yet.</p>`;
    return;
  }
  res.data.results.forEach(f => list.appendChild(freelancerCard(f)));
}

function freelancerCard(f) {
  const div = document.createElement("div");
  div.className = "col-md-6";
  div.innerHTML = `
    <div class="fwp-card p-3 h-100 d-flex flex-row gap-3">
      ${FWP.matchRingHTML(f.match_score)}
      <div class="flex-grow-1">
        <div class="d-flex justify-content-between">
          <h6 class="mb-1"><a href="/client/freelancer/${f.id}">${f.name}</a></h6>
          <span class="badge-category">${f.category || ""}</span>
        </div>
        <div class="mb-1">${FWP.starsHTML(f.average_rating)} <span class="small text-muted-fwp">(${f.total_reviews})</span></div>
        <p class="small text-muted-fwp mb-1">${(f.skills_text || "").split(",").slice(0,4).join(" · ")}</p>
        <p class="mono small mb-2">$${f.hourly_rate}/hr · ${f.experience_years}y exp · ${f.completed_projects_count} projects</p>
        <div class="d-flex gap-2">
          <a href="/client/freelancer/${f.id}" class="btn btn-fwp-outline btn-sm">View profile</a>
          <button class="btn btn-fwp-gold btn-sm" onclick="openHireModal(${f.id})">Hire</button>
        </div>
      </div>
    </div>`;
  return div;
}

function openHireModal(freelancerId) {
  document.getElementById("hireFreelancerId").value = freelancerId;
  hireModal.show();
}

async function sendHireRequest() {
  const freelancer_id = document.getElementById("hireFreelancerId").value;
  const title = document.getElementById("hireTitle").value.trim();
  const description = document.getElementById("hireDescription").value.trim();
  const budget = document.getElementById("hireBudget").value;
  const timeline_days = document.getElementById("hireTimeline").value;

  if (!title) { FWP.toast("Project title is required.", true); return; }

  const res = await FWP.api("/api/project/request", { method: "POST",
    body: { freelancer_id, title, description, budget, timeline_days } });
  if (res && res.ok) { FWP.toast("Request sent!"); hireModal.hide(); }
  else FWP.toast((res && res.data && res.data.message) || "Could not send request.", true);
}

document.addEventListener("DOMContentLoaded", () => {
  hireModal = new bootstrap.Modal(document.getElementById("hireModal"));
  prefillFromUrl();
  loadResults();
});
</script>
{% endblock %}
